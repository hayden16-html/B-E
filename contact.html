<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="contact.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200&display=swap" rel="stylesheet">
    <title>Contact Us</title>
</head>
<body>
    <nav>
        <ul>
            <img id="logo" src="./assets/Best_events_final_nbg-cropped.png" alt="logo">
            <li><a href="./index.html">Home</a></li>
            <li><a href="./index.html#About_us">About us</a></li>
            <li><a href="./index.html#Portfolio">Portfolio</a></li>
            <li id="contact"><a href="./contact.html">Contact</a></li>
        </ul>
    </nav>
    <main>
    <section id="contact-section">
    <h2>Contact Us</h2>
    <form id="contact-form" method="post" action="https://formsubmit.co/orsmondhayden@gmail.com">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="tel">Phone:</label>
        <input type="tel" id="tel" name="tel" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send</button>
    </form>
    </section>

        <div class="contact-main">
            <h2>Get in Touch</h2>
            <p>Please fill out this form and we will respond as soon as possible.</p>
        </div>
    </main>

</body>
</html>
